name: Release

# Build Windows + Linux artifacts and attach them to a GitHub Release whenever a
# version tag (e.g. v0.1.0) is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Note: these builds are NOT code-signed. For signed production releases, run the signing
# step in packaging/windows/ before/after publishing (or add your cert as a CI secret).

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # required to create/update the Release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build (Windows + NSIS installer)
        working-directory: cmd/localvault
        run: wails build -platform windows/amd64 -nsis
      - name: Stage artifacts
        shell: bash
        run: |
          mkdir dist-artifacts
          cp cmd/localvault/build/bin/Kosh.exe "dist-artifacts/Kosh-${GITHUB_REF_NAME}-windows-amd64.exe"
          cp cmd/localvault/build/bin/*installer.exe "dist-artifacts/Kosh-${GITHUB_REF_NAME}-windows-amd64-setup.exe" || true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*

  linux:
    # ubuntu-22.04 ships webkit2gtk-4.0 (the well-trodden Wails target). On newer runners
    # use libwebkit2gtk-4.1-dev and add `-tags webkit2_41` to the wails build.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.0-dev
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build (Linux)
        working-directory: cmd/localvault
        run: wails build -platform linux/amd64
      - name: Package .deb
        run: bash packaging/linux/package-deb.sh "${GITHUB_REF_NAME}"
      - name: Stage artifacts
        run: |
          mkdir dist-artifacts
          cp cmd/localvault/build/bin/Kosh "dist-artifacts/Kosh-${GITHUB_REF_NAME}-linux-amd64"
          cp *.deb dist-artifacts/ || true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*
