name: Release

# Build Windows + Linux artifacts and attach them to a GitHub Release whenever a
# version tag (e.g. v0.1.0) is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Code-signing is OPTIONAL and automatic: if the repository secrets WINDOWS_PFX_BASE64
# (base64 of your code-signing .pfx) and WINDOWS_PFX_PASSWORD are set, the Windows binary
# and installer are Authenticode-signed so SmartScreen shows a real publisher. If those
# secrets are absent, the release still builds — just unsigned. Every artifact is published
# with a SHA256SUMS file so downloaders can verify integrity either way.

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # required to create/update the Release

jobs:
  windows:
    runs-on: windows-latest
    env:
      WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
      WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build (Windows + NSIS installer)
        working-directory: cmd/localvault
        run: wails build -platform windows/amd64 -nsis
      - name: Code-sign (runs only if signing secrets are configured)
        if: ${{ env.WINDOWS_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'kosh-codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $env:KOSH_SIGN_PFX = $pfx
          $env:KOSH_SIGN_PFX_PW = $env:WINDOWS_PFX_PASSWORD
          try {
            ./packaging/windows/sign.ps1 -File cmd/localvault/build/bin/Kosh.exe
            Get-ChildItem cmd/localvault/build/bin/*installer.exe -ErrorAction SilentlyContinue |
              ForEach-Object { ./packaging/windows/sign.ps1 -File $_.FullName }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }
      - name: Stage artifacts
        shell: bash
        run: |
          mkdir dist-artifacts
          cp cmd/localvault/build/bin/Kosh.exe "dist-artifacts/Kosh-${GITHUB_REF_NAME}-windows-amd64.exe"
          cp cmd/localvault/build/bin/*installer.exe "dist-artifacts/Kosh-${GITHUB_REF_NAME}-windows-amd64-setup.exe" || true
      - name: Checksums
        shell: bash
        working-directory: dist-artifacts
        run: sha256sum * > SHA256SUMS-windows.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*

  linux:
    # ubuntu-22.04 ships webkit2gtk-4.0 (the well-trodden Wails target). On newer runners
    # use libwebkit2gtk-4.1-dev and add `-tags webkit2_41` to the wails build.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.0-dev
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build (Linux)
        working-directory: cmd/localvault
        run: wails build -platform linux/amd64
      - name: Package .deb
        run: bash packaging/linux/package-deb.sh "${GITHUB_REF_NAME}"
      - name: Stage artifacts
        run: |
          mkdir dist-artifacts
          cp cmd/localvault/build/bin/Kosh "dist-artifacts/Kosh-${GITHUB_REF_NAME}-linux-amd64"
          cp *.deb dist-artifacts/ || true
      - name: Checksums
        working-directory: dist-artifacts
        run: sha256sum * > SHA256SUMS-linux.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*
