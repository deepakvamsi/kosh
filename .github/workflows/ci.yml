name: CI

on:
  push:
    branches: [main]
  pull_request:

# The repo is TWO Go modules: the root (kosh) and the Wails app (kosh/cmd/localvault,
# which `replace`s kosh => ../../). `go test ./...` at the root does NOT descend into a
# nested module, so every job below runs both explicitly. Missing this is how app.go
# stayed uncompiled by CI.
jobs:
  test:
    # Kosh ships Windows, Linux and macOS builds, and the platform-specific security
    # code (DACL hardening, screen-capture exclusion, per-OS data dirs) only compiles
    # under its own GOOS. A single-runner job never builds it — so the matrix is the
    # gate, not a nicety.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      # Linux needs GTK/WebKit headers before the Wails app module will build.
      - name: Install Linux GUI toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # The air-seal test walks cmd/localvault, which embeds frontend/dist — build it
      # first so the embed directive resolves on a clean checkout.
      - name: Install frontend deps
        working-directory: cmd/localvault/frontend
        run: npm ci
      - name: Typecheck frontend
        working-directory: cmd/localvault/frontend
        run: npx tsc --noEmit
      - name: Build frontend
        working-directory: cmd/localvault/frontend
        run: npm run build

      # Formatting is checked on Linux only. Line endings are normalised to LF in the
      # index (.gitattributes), but a Windows runner can still present CRLF working
      # copies, which gofmt reports as unformatted — noise, not a finding.
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          # gofmt walks directories, not modules, so this covers cmd/localvault too.
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet (root module)
        run: go vet ./...
      - name: go vet (app module)
        working-directory: cmd/localvault
        run: go vet ./...

      - name: go build (compiles every GOOS-specific file on this runner)
        run: go build ./...
      - name: go build (app module)
        working-directory: cmd/localvault
        run: go build ./...

      # Kosh builds CGO-free (modernc.org/sqlite) but -race requires cgo and a C
      # toolchain. Linux/macOS runners ship one; the Windows runner does not, so it
      # runs the suite without the race detector rather than installing a compiler
      # the shipped binary never uses.
      #
      # -timeout=30m (default is 10m/package): the crypto suite calibrates Argon2id by
      # timing real derivations at up to 512 MiB, and the vault suite runs Argon2id on
      # every Init/Unlock. The race detector instruments every memory access, so a
      # memory-hard KDF runs many times slower under -race; on a slow/noisy runner the
      # default 10m was occasionally exceeded, failing an identical binary that passed
      # elsewhere. The larger budget removes that timing flake without touching coverage.
      - name: go test -race (includes the network air-seal guard)
        if: runner.os != 'Windows'
        env: { CGO_ENABLED: '1' }
        run: |
          go test -race -timeout=30m ./...
          cd cmd/localvault && go test -race -timeout=30m ./...
      - name: go test (includes the network air-seal guard)
        if: runner.os == 'Windows'
        run: |
          go test ./...
          cd cmd/localvault
          go test ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install Linux GUI toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      # govulncheck loads packages, so the frontend/dist embed must resolve.
      - name: Build frontend
        working-directory: cmd/localvault/frontend
        run: npm ci && npm run build
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck (root module)
        run: govulncheck ./...
      # The app module is where the real third-party surface lives (Wails, echo,
      # gorilla/websocket), so scanning only the root would miss most of it.
      - name: govulncheck (app module)
        working-directory: cmd/localvault
        run: govulncheck ./...
