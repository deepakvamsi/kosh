name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      # The air-seal test analyzes cmd/localvault, which embeds frontend/dist — build it
      # first so the embed directive resolves on a clean checkout.
      - name: Build frontend
        working-directory: cmd/localvault/frontend
        run: npm ci && npm run build
      - name: go vet
        run: go vet ./...
      - name: go test (includes the network air-seal guard)
        run: go test ./...
